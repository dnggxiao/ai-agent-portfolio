name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Check synchronized content
        run: python tools/build_docs.py --check
      - name: Verify structure and JavaScript syntax
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test the synthetic calculation example
        run: node --test tests/demo.test.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Check the website over local HTTP
        run: python tests/browser_check.py
